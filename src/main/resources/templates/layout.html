<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(pageTitle, activePage, showNavbar, content)">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title th:text="${pageTitle} ?: 'UUPokedex'">UUPokedex</title>

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Bootstrap Icons -->
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <!-- Tailwind (sin preflight para no romper Bootstrap) -->
        <script>
            tailwind.config = {corePlugins: {preflight: false}}
        </script>
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- Tu CSS -->
        <link rel="stylesheet" th:href="@{/templates.css/login.css}" />
    </head>

    <body class="min-vh-100 overflow-x-hidden bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-white">

        <header th:if="${showNavbar} == null ? true : ${showNavbar}">
            <nav class="navbar navbar-expand-lg sticky-top border-bottom border-white/10 bg-black/30 backdrop-blur">
                <div class="container">

                    <a class="navbar-brand fw-bold text-white d-flex align-items-center gap-2" th:href="@{/}">
                        <span class="inline-flex items-center justify-center rounded-xl px-3 py-2 bg-white/10 border border-white/10">
                            UUPokedex
                        </span>
                        <span class="text-white/60 small d-none d-sm-inline">Client</span>
                    </a>

                    <button class="navbar-toggler border border-white/20 text-white"
                            type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                            aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="mainNav">
                        <ul class="navbar-nav me-auto mt-3 mt-lg-0 gap-1">
                            <li class="nav-item">
                                <a class="nav-link rounded-3 px-3 py-2"
                                   th:href="@{/}"
                                   th:classappend="${activePage}=='home' ? ' bg-white/10 text-white' : ' text-white/70 hover:text-white hover:bg-white/5'">
                                    Home
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link rounded-3 px-3 py-2"
                                   th:href="@{/pokemons}"
                                   th:classappend="${activePage}=='pokemons' ? ' bg-white/10 text-white' : ' text-white/70 hover:text-white hover:bg-white/5'">
                                    Pokémons
                                </a>
                            </li>
                        </ul>

                        <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0">
                            <a th:href="@{/login}"
                               class="btn btn-sm rounded-3 border border-white/15 text-white bg-white/10 hover:bg-white/15">
                                Login
                            </a>
                        </div>
                    </div>

                </div>
            </nav>
        </header>

        <!-- Main: cambia padding si NO hay navbar -->
        <main th:class="'container ' + ((${showNavbar} == null ? true : ${showNavbar}) ? 'py-4' : 'py-0')">
            <div class="mx-auto max-w-5xl">
                <div th:replace="${content}"></div>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Tu JS (opcional, si luego lo creas) -->
        <script th:src="@{/js/app.js}"></script>
    </body>
</html>
