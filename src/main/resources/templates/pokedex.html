<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Pokémons', 'pokemons', true, ~{::section})}">

    <section class="py-3 pokedex-theme">

        <form id="pokedexForm" class="container-xl pokedex-shell" autocomplete="off">

            <input type="hidden" name="type" id="typeInput" value="">
            <input type="hidden" name="view" id="viewInput" value="grid">
            <input type="hidden" name="offset" id="offsetInput" value="0">

            <div class="floating-panel rocket-glass">

                <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3 mb-3">
                    <div>
                        <div class="d-flex flex-wrap align-items-center gap-2">
                            <span class="brand-mark" aria-hidden="true"></span>
                            <h1 class="h3 mb-0 fw-bold title-glow">Pokédex</h1>
                            <span class="badge badge-ash">ASH</span>
                            <span class="badge badge-rocket">TEAM ROCKET</span>
                        </div>
                        <div class="text-muted-soft mt-1">
                        </div>
                    </div>

                </div>

                <!-- BODY -->
                <div class="row g-3">

                    <!-- RIGHT: LISTADO -->
                    <div class="col-12">
                        <div class="panel-card">
                            <div class="panel-head d-flex align-items-center justify-content-between flex-wrap gap-2">
                                <div class="d-flex align-items-center gap-2">
                                    <i class="bi bi-grid"></i>
                                    <span class="fw-bold">Listado</span>
                                    <span class="badge bg-white/10 border border-white/10 text-white/80" id="countBadge">0</span>
                                </div>

                                <div class="d-flex align-items-center gap-2">
                                    <span class="small text-muted-soft" id="metaLine">limit=12 • offset=0</span>
                                </div>
                            </div>

                            <div class="panel-body">

                                <div id="loadingState" class="empty-state" hidden>
                                    <div class="empty-icon"><i class="bi bi-arrow-repeat"></i></div>
                                    <div class="fw-bold">Cargando Pokémons…</div>
                                    <div class="text-muted-soft small mt-1">Consultando PokeAPI</div>
                                </div>

                                <div id="errorState" class="alert alert-danger border-0 bg-danger/10 text-white" hidden></div>

                                <div id="emptyState" class="empty-state" hidden>
                                    <div class="empty-icon"><i class="bi bi-inboxes"></i></div>
                                    <div class="fw-bold">Sin resultados</div>
                                    <div class="text-muted-soft small mt-1">Prueba otra búsqueda o tipo.</div>
                                </div>

                                <div id="pokeGrid" class="row g-4"></div>
                                <div id="pokeList" class="d-flex flex-column gap-2" hidden></div>

                                <div class="mt-4 d-flex align-items-center justify-content-between flex-wrap gap-2">
                                    <span id="pageMeta" class="small text-muted-soft"></span>

                                    <nav aria-label="pagination">
                                        <ul class="pagination pagination-neo mb-0">
                                            <li class="page-item"><a id="prevPage" class="page-link" href="#">Anterior</a></li>
                                            <li class="page-item"><a id="homePage" class="page-link" href="#">Inicio</a></li>
                                            <li class="page-item"><a id="nextPage" class="page-link" href="#">Siguiente</a></li>
                                        </ul>
                                    </nav>
                                </div>

                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </form>

        <!-- Modal detalle -->
        <div class="modal fade" id="pokemonModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content modal-neo">
                    <div class="modal-header border-0">
                        <div class="d-flex align-items-center gap-2">
                            <span class="mini-ball" aria-hidden="true"></span>
                            <div>
                                <div class="fw-bold" id="modalTitle">Pokémon</div>
                                <div class="small text-muted-soft" id="modalSubtitle">Detalle desde PokeAPI</div>
                            </div>
                        </div>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-12 col-md-5">
                                <div class="detail-card">
                                    <div class="detail-sprite">
                                        <img id="modalSprite" alt="sprite" />
                                    </div>
                                    <div class="d-flex flex-wrap gap-2 mt-3" id="modalTypes"></div>
                                </div>
                            </div>
                            <div class="col-12 col-md-7">
                                <div class="detail-card">
                                    <div class="fw-bold mb-2">Stats</div>
                                    <div class="d-grid gap-2" id="modalStats"></div>

                                    <hr class="hr-neo my-3">

                                    <div class="fw-bold mb-2">Info</div>
                                    <div class="d-flex flex-wrap gap-2" id="modalInfo"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button class="btn btn-neo btn-neo-outline rounded-3" data-bs-dismiss="modal" type="button">
                            Cerrar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <script src="/js/pokedex.js"></script>

    </section>
</html>
