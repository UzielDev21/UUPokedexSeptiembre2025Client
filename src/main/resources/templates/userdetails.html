<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"  th:replace="~{layout :: layout('Detalles', 'Detalles', true, ~{::section})}">
    <section class="pokedex-theme p-0">

        <div class="card tarjeta">
            <div class="top-card">
                <img src="https://mir-s3-cdn-cf.behance.net/project_modules/1400/10f13510774061.560eadfde5b61.png" alt="icon" />
                <i class="bi bi-circle-fill text-success" aria-label="Active User"></i>
            </div>
            <div class="card-body mt-4">
                <p class="card-titulo"> Miguel Mateo <i class="bi bi-patch-check-fill"></i></p>
                <div class="d-flex gap-3 justify-content-center">
                    <p class="card-text" > <i class="bi bi-envelope-fill"></i> miguelmateomartines@gmail</p>
                    <p class="card-text" ><i class="bi bi-lightning-charge-fill"></i>
                        Entrenador Pokémon </p>
                    <p class="card-text" ><i class="bi bi-person-vcard-fill"></i> mikimatt02</p>
                </div>
                <div class="text-end">
                    <a href="#" class="btn btn-primary">Editar</a>
                </div>
            </div>

            <section class="favorites">
                <header class="favorites-header">
                    <h2>⭐ Pokémon Favoritos</h2>
                    <p>Tus compañeros más valiosos</p>
                </header>

                <div class="favorites-grid">
                    <article class="fav-card">
                        <button class="fav-card-star" aria-label="Quitar de favoritos" aria-pressed="true">
                            ★
                        </button>
                        <div class="fav-card-art">
                            <img
                                src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png"
                                alt="Pikachu">
                        </div>
                        <div class="fav-card-body">
                            <h3 class="fav-card-name">Pikachu</h3>

                            <div class="fav-card-types">
                                <span class="type type-fire">Fuego</span>
                            </div>
                        </div>
                    </article>
                </div>
            </section>
        </div>
    </section>

</html>
