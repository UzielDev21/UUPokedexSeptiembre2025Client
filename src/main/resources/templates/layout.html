<!-- /templates/layout.html -->
<!doctype html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(pageTitle, activePage, showNavbar, content)">

    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title th:text="${pageTitle} ?: 'UUPokedex'">Pokedex</title>

        <!-- CSS -->
        <link href="/css/pokedex.css" rel="stylesheet">
        <link href="/css/login.css" rel="stylesheet">
        <link href="/css/pokedetails.css" rel="stylesheet">
        <link href="/css/userdetails.css" rel="stylesheet">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

        <!-- Tailwind -->
        <script>
            tailwind.config = {darkMode: "class", corePlugins: {preflight: false}}
        </script>
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- Tema -->
        <script>
            (function () {
                const saved = localStorage.getItem("uu_theme");
                const isNight = saved === "night";
                document.documentElement.classList.toggle("dark", isNight);
            })();
        </script>
    </head>

    <body class="min-vh-100 overflow-x-hidden app-theme text-slate-900 dark:text-white">

        <header th:if="${showNavbar} == null ? true : ${showNavbar}">
            <nav class="navbar navbar-expand-lg sticky-top poke-navbar">
                <div class="container">

                    <!-- BRAND -->
                    <a class="navbar-brand d-flex align-items-center gap-3" th:href="@{/pokedex}">
                        <div class="poke-ui-left">
                            <div class="poke-avatar">
                                <span class="poke-avatar-letter"
                                      th:with="uname=${#authentication != null ? #authentication.name : 'U'}"
                                      th:text="${#strings.toUpperCase(#strings.substring(uname,0,1))}">
                                    U
                                </span>
                            </div>

                            <div class="poke-lights">
                                <span class="poke-light poke-light-red"></span>
                                <span class="poke-light poke-light-yellow"></span>
                                <span class="poke-light poke-light-green"></span>
                            </div>
                        </div>

                        <div class="d-flex flex-column lh-1">
                            <span class="poke-brand-title">UUPokedex</span>
                            <span class="poke-brand-sub">Client</span>
                        </div>
                    </a>
                    
                    <!-- RIGHT -->
                    <div class="d-flex align-items-center gap-2 ms-auto">

                        <!-- THEME -->
                        <button id="themeToggle"
                                type="button"
                                class="btn btn-sm rounded-3 poke-btn d-inline-flex align-items-center gap-2">
                            <span class="theme-day"><i class="bi bi-sun-fill"></i> Claro</span>
                            <span class="theme-night"><i class="bi bi-moon-stars-fill"></i> Oscuro</span>
                        </button>

                        <!--usuario que esta en sesión-->
                        <div class="position-absolute top-0 end-0 p-3">
                            <div class="dropdown">

                                <!-- El nombre del usuario -->
                                <a class="text-decoration-none dropdown-toggle fw-bold usuario" 
                                   role="button" 
                                   id="dropdownMenuLink" 
                                   data-bs-toggle="dropdown" 
                                   aria-expanded="false"
                                   style="font-size: 16px; color: #f4f4f4;">
                                    <i class="bi bi-person-circle"></i> 
                                    <span th:text="${UsuarioLogueado != null ? UsuarioLogueado : 'Invitado'}">Usuario</span>
                                </a>

                                <!-- Menú desplegable -->
                                <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="dropdownMenuLink">

                                    <!--usuario logeado-->
                                    <li th:if="${UsuarioLogueado != null}">
                                        <a class="dropdown-item d-flex align-items-center"
                                           th:href="@{/user-details}">
                                            <i class="bi bi-info-circle me-2"></i>
                                            Información
                                        </a>
                                    </li>

                                    <li th:if="${UsuarioLogueado != null}">
                                        <hr class="dropdown-divider">
                                    </li>

                                    <!-- Logout real -->
                                    <li th:if="${UsuarioLogueado != null}">
                                        <form method="POST"
                                              th:action="@{/auth/logout}"
                                              class="px-2 m-0">
                                            <button class="dropdown-item text-danger d-flex align-items-center"
                                                    type="submit">
                                                <i class="bi bi-box-arrow-right me-2"></i>
                                                Salir
                                            </button>
                                        </form>
                                    </li>

                                    <!--invitado-->
                                    <li th:unless="${UsuarioLogueado != null}">
                                        <a class="dropdown-item d-flex align-items-center text-primary"
                                           th:href="@{/usuario/registrar}">
                                            <i class="bi bi-person-plus-fill me-2"></i>
                                            Registrarse
                                        </a>
                                    </li>

                                    <li th:unless="${UsuarioLogueado != null}">
                                        <a class="dropdown-item d-flex align-items-center"
                                           th:href="@{/auth/login}">
                                            <i class="bi bi-info-circle me-2"></i>
                                            Iniciar sesión
                                        </a>
                                    </li>

                                </ul>
                            </div>
                        </div>

                        <!-- MENU -->
                        <div class="collapse navbar-collapse" id="mainNav">
                            <ul class="navbar-nav me-auto gap-1">
                                <li class="nav-item">
                                    <a class="nav-link poke-link"
                                       th:href="@{/}"
                                       th:classappend="${activePage}=='home' ? ' active' : ''">
                                        Home
                                    </a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link poke-link"
                                       th:href="@{/pokemons}"
                                       th:classappend="${activePage}=='pokemons' ? ' active' : ''">
                                        Pokémons
                                    </a>
                                </li>
                            </ul>
                        </div>

                    </div>
            </nav>
        </header>

        <main th:class="'container ' + ((${showNavbar} == null ? true : ${showNavbar}) ? 'py-4' : 'py-0')">
            <div class="mx-auto max-w-5xl">
                <div th:replace="${content}"></div>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/theme.js}" defer></script>

    </body>
</html>
