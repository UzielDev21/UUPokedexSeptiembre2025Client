<!-- /templates/layout.html -->
<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, activePage, showNavbar, content)">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title th:text="${pageTitle} ?: 'UUPokedex'">Pokedex</title>

        <link href="/css/pokedex.css" rel="stylesheet">
        <link href="/css/login.css" rel="stylesheet">
        <link href="/css/pokedetails.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <link href="/css/pokedex.css" rel="stylesheet">
        <link href="/css/login.css" rel="stylesheet">
        <link rel="stylesheet" href="/css/userdetails.css"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <script>
            tailwind.config = {darkMode: "class", corePlugins: {preflight: false}}
        </script>
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- aplica el tema ANTES de pintar la UI (evita flash) -->
        <script>
            (function () {
                const saved = localStorage.getItem("uu_theme"); // "day" | "night"
                const isNight = saved ? saved === "night" : false; // default: día
                document.documentElement.classList.toggle("dark", isNight);
            })();
        </script>
    </head>

    <body class="min-vh-100 overflow-x-hidden app-theme text-slate-900 dark:text-white">

        <header th:if="${showNavbar} == null ? true : ${showNavbar}">
            <nav class="navbar navbar-expand-lg sticky-top poke-navbar">
                <div class="container">

                    <!-- LEFT -->
                    <a class="navbar-brand d-flex align-items-center gap-3" th:href="@{/}">
                        <div class="poke-ui-left">
                            <div class="poke-avatar" aria-hidden="true">
                                <span class="poke-avatar-letter"
                                      th:with="uname=${#authentication != null ? #authentication.name : 'U'}"
                                      th:text="${#strings.toUpperCase(#strings.substring(uname,0,1))}">
                                    U
                                </span>
                            </div>

                            <div class="poke-lights" aria-hidden="true">
                                <span class="poke-light poke-light-red"></span>
                                <span class="poke-light poke-light-yellow"></span>
                                <span class="poke-light poke-light-green"></span>
                            </div>
                        </div>

                        <div class="d-flex flex-column lh-1">
                            <span class="poke-brand-title">UUPokedex</span>
                            <span class="poke-brand-sub">Client</span>
                        </div>
                    </a>

                    <!-- ACTIONS ALWAYS VISIBLE -->
                    <div class="d-flex align-items-center gap-2 ms-auto order-lg-2">

                        <button id="themeToggle" type="button"
                                class="btn btn-sm rounded-3 poke-btn inline-flex items-center gap-2" aria-label="Cambiar tema">
                            <span class="theme-day inline-flex items-center gap-2">
                                <i class="bi bi-sun-fill"></i> Día
                            </span>
                            <span class="theme-night inline-flex items-center gap-2">
                                <i class="bi bi-moon-stars-fill"></i> Noche
                            </span>
                        </button>

                        <div class="dropdown" th:if="${#authentication != null and #authentication.authenticated}">
                            <button
                                class="btn btn-sm rounded-3 poke-btn dropdown-toggle d-inline-flex align-items-center gap-2"
                                type="button" data-bs-toggle="dropdown" aria-expanded="false">

                                <span class="poke-mini-avatar" th:with="uname=${#authentication.name}"
                                      th:text="${#strings.toUpperCase(#strings.substring(uname,0,1))}">
                                    U
                                </span>

                                <span class="d-none d-md-inline" th:text="${#authentication.name}">
                                    Usuario
                                </span>
                            </button>

                            <ul class="dropdown-menu dropdown-menu-end poke-dropdown">
                                <li class="px-3 py-2">
                                    <div class="d-flex align-items-center gap-2">
                                        <span class="poke-mini-avatar" th:with="uname=${#authentication.name}"
                                              th:text="${#strings.toUpperCase(#strings.substring(uname,0,1))}">
                                            U
                                        </span>
                                        <div class="lh-1">
                                            <div class="fw-bold text-slate-900" th:text="${#authentication.name}">Usuario
                                            </div>
                                            <div class="small text-slate-500">Entrenador</div>
                                        </div>
                                    </div>
                                </li>

                                <li>
                                    <hr class="dropdown-divider my-1">
                                </li>

                                <li>
                                    <a class="dropdown-item d-flex align-items-center gap-2"
                                       th:href="@{/users/{id}(id=${#authentication.principal.id})}">
                                        <i class="bi bi-person"></i> Perfil
                                    </a>
                                </li>

                                <li>
                                    <hr class="dropdown-divider my-1">
                                </li>

                                <li class="px-2">
                                    <form th:action="@{/logout}" method="post" class="m-0">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <button type="submit"
                                                class="dropdown-item d-flex align-items-center gap-2 text-danger">
                                            <i class="bi bi-box-arrow-right"></i> Cerrar sesión
                                        </button>
                                    </form>
                                </li>
                            </ul>
                        </div>

                        <a th:unless="${#authentication != null and #authentication.authenticated}" th:href="@{/login}"
                           class="btn btn-sm rounded-3 poke-btn">
                            <i class="bi bi-door-open me-1"></i> Login
                        </a>

                        <button class="navbar-toggler poke-toggler order-lg-3" type="button" data-bs-toggle="collapse"
                                data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false"
                                aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
                        </button>
                    </div>

                    <!-- COLLAPSE LINKS -->
                    <div class="collapse navbar-collapse order-lg-1" id="mainNav">
                        <ul class="navbar-nav me-auto mt-3 mt-lg-0 gap-1">
                            <li class="nav-item">
                                <a class="nav-link poke-link rounded-3 px-3 py-2" th:href="@{/}"
                                   th:classappend="${activePage}=='home' ? ' active' : ''">
                                    Home
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link poke-link rounded-3 px-3 py-2" th:href="@{/pokemons}"
                                   th:classappend="${activePage}=='pokemons' ? ' active' : ''">
                                    Pokémons
                                </a>
                            </li>
                        </ul>
                    </div>

                </div>
            </nav>
        </header>

        <main th:class="'container ' + ((${showNavbar} == null ? true : ${showNavbar}) ? 'py-4' : 'py-0')">
            <div class="mx-auto max-w-5xl">
                <div th:replace="${content}"></div>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/theme.js}" defer></script>

    </body>

</html>
